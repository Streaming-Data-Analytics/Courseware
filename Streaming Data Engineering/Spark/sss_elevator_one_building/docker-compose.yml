---
# Kafka & Spark Structured Streaming — one building
#
# The same two-service stack as sss_elevator-fleet, and deliberately so: the
# lecture after this one reuses it at fleet scale, and nothing about the
# infrastructure should change when the scale does. Both images are
# multi-architecture, so this runs natively on Apple Silicon, on Intel and on
# Windows/WSL2.
#
# Kafka runs in KRaft mode, so there is no ZooKeeper.
services:
  kafka:
    image: apache/kafka:3.9.1
    container_name: kafka
    ports:
      # 9092 is the internal listener, reachable as `kafka:9092` from the
      # notebook container. 29092 is published for tools on your laptop.
      - 29092:29092
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENERS: PLAINTEXT://:9092,HOST://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # off on purpose. The simulator creates `building-events` with 3
      # partitions, one per lift unit, and that number is a decision taken in
      # lecture 8. With auto-creation on, running the monitoring notebook first
      # would silently make a 1-partition topic and the explicit creation would
      # then fail — a wrong number instead of a clear error.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"

  notebook:
    image: quay.io/jupyter/pyspark-notebook:spark-3.5.0
    container_name: building-notebook
    depends_on:
      - kafka
    ports:
      - 8888:8888
    volumes:
      - ./notebooks:/home/jovyan/work
      # runs before the Jupyter server starts, so nothing in the lecture depends
      # on a kernel being able to launch a subprocess.
      - ./setup/20-kafka-client.sh:/usr/local/bin/before-notebook.d/20-kafka-client.sh:ro
    environment:
      - JUPYTER_TOKEN=sda
